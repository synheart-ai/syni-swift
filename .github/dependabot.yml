version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "10:00"
      timezone: Africa/Addis_Ababa
    commit-message:
      prefix: ci
    groups:
      dependency-updates:
        patterns: ["*"]
    ignore:
      # Keep major upgrades separate for manual review.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
