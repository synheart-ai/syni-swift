name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: swift build
        run: swift build

      - name: swift test
        run: swift test

      - name: xcodebuild iOS (catch iOS-specific breakage)
        run: |
          xcodebuild build \
            -scheme Syni \
            -destination 'generic/platform=iOS' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
